spring:
  profiles:
    default: docker
  application:
    name: coroutines-concept-server-webflux
server:
  port: 8011
app:
  service-prefix: server-webflux
  tcp:
    backlog: 100000
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
